[package]
name = "stateless-architecture"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of the stateless core loop"
license = "MIT"
repository = "https://github.com/stateless-engineering/stateless-architecture"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
serde_json = "1"

[lib]
name = "stateless_architecture"
path = "rust/src/lib.rs"
