name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust reference impl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Format
        run: cargo fmt -- --check

  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Validate state-blob schema (Ajv 2020-12)
        run: |
          npm install --no-save ajv@8 ajv-formats
          node - << 'EOF'
          const Ajv2020 = require('ajv/dist/2020.js');
          const addFormats = require('ajv-formats');
          const ajv = new Ajv2020({ strict: false });
          addFormats(ajv);

          const schema = require('./spec/state-blob.schema.json');
          const validate = ajv.compile(schema);
          console.log('schema compiles: OK');

          // Sample blob with a seal (must validate).
          const sealed = {
            version: '0.1.0',
            schema: 'https://example.com/chat',
            timestamp: '2026-08-05T00:00:00Z',
            payload: null,
            seal: {
              algorithm: 'AES-256-GCM',
              ciphertext: 'a1b2c3',
              nonce: 'deadbeef',
            },
            parent: null,
          };
          // Sample unsealed blob (must validate).
          const unsealed = {
            version: '0.1.0',
            schema: 'https://example.com/chat',
            timestamp: '2026-08-05T00:00:00Z',
            payload: { count: 42 },
            seal: null,
            parent: null,
          };
          for (const [name, doc] of [['sealed', sealed], ['unsealed', unsealed]]) {
            const ok = validate(doc);
            if (!ok) {
              console.error(`${name} blob INVALID:`, JSON.stringify(validate.errors, null, 1));
              process.exit(1);
            }
            console.log(`${name} blob: valid`);
          }
          EOF
